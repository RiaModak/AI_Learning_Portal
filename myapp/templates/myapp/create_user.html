<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create User</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" />

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #2f3d4b;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border-bottom: 3px solid #1d2733;
        }

        .container {
            max-width: 900px;
            padding: 30px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.12);
            padding: 25px;
            transition: 0.3s ease-in-out;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h4 {
            color: #2f3d4b;
            font-weight: 600;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #2f3d4b;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1d2733;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .messages-box {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

<nav>
    Create User
</nav>

<div class="container">

    <div class="card">

        {% if messages %}
            {% for message in messages %}
                <div class="messages-box">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <h4 class="mb-3">New User Details</h4>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-primary">
                Create User
            </button>

            <a href="{% url 'superadmin_dashboard' %}" class="btn btn-secondary ms-2">
                Back
            </a>
        </form>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
