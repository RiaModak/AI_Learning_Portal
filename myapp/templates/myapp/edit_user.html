<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
</head>
<body>

<h1>Edit User</h1>
{% if messages %}
    {% for message in messages %}
        <div style="
            padding:10px;
            margin-bottom:10px;
            border:1px solid green;
            background:#d4edda;
        ">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a href="{% url 'user_detail' user_obj.id %}">
    Cancel
</a>

</body>
</html>
