<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Portal - Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#f8fafc;
            font-family:'Segoe UI',sans-serif;
            display:flex;
            flex-direction:column;
        }

        /* Top Navbar */

        nav{
            background:white;
            border-bottom:1px solid #e2e8f0;
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .brand{
            font-size:1.3rem;
            font-weight:700;
            color:#0f172a;
        }

        .brand span{
            color:#2563eb;
        }

        /* Login Section */

        .login-wrapper{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .login-card{
            width:100%;
            max-width:420px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:
                0 4px 6px rgba(0,0,0,0.05),
                0 10px 15px rgba(0,0,0,0.05);
        }

        .login-header{
            text-align:center;
            margin-bottom:30px;
        }

        .login-header h2{
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }

        .login-header p{
            color:#64748b;
            margin-bottom:0;
        }

        .form-control{
            border-radius:12px;
            padding:12px 15px;
            border:1px solid #cbd5e1;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,0.15);
        }

        .btn-login{
            width:100%;
            background:#2563eb;
            border:none;
            border-radius:12px;
            padding:12px;
            color:white;
            font-weight:600;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .error-message{
            text-align:center;
            margin-top:15px;
            color:#dc2626;
            font-weight:500;
        }

        .footer-text{
            text-align:center;
            margin-top:25px;
            color:#94a3b8;
            font-size:14px;
        }

    </style>
</head>

<body>

<nav>
    <div class="brand">
        AI Learning <span>Portal</span>
    </div>
</nav>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue to your dashboard</p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Sign In
            </button>

        </form>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <div class="footer-text">
            AI Learning Portal © 2026
        </div>

    </div>

</div>

</body>
</html>
```
